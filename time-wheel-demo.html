<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>时间滚轮 Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #f1f0ed; color: #2d2d2d; }
    .shade { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(22, 20, 17, .25); }
    .dialog { width: min(100%, 370px); padding: 24px 20px 12px; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px rgba(26, 24, 20, .18); }
    h1 { margin: 0 0 12px; text-align: center; font-size: 19px; line-height: 1.3; font-weight: 650; letter-spacing: .02em; }
    .wheels { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; height: 210px; }
    .column { min-width: 0; text-align: center; }
    .wheel { position: relative; height: 190px; overflow: hidden; background: #fff; touch-action: none; user-select: none; cursor: ns-resize; }
    .wheel::before, .wheel::after { position: absolute; z-index: 2; left: 0; right: 0; height: 30px; content: ""; pointer-events: none; }
    .wheel::before { top: 0; background: linear-gradient(#fff, rgba(255,255,255,0)); }
    .wheel::after { bottom: 0; background: linear-gradient(rgba(255,255,255,0), #fff); }
    .highlight { position: absolute; z-index: 0; top: 50%; left: 8px; right: 8px; height: 44px; transform: translateY(-50%); border-radius: 14px; background: #f5d11b; }
    .item { position: absolute; z-index: 1; top: 50%; left: 0; right: 0; height: 46px; display: grid; place-items: center; transform: translateY(-50%); font-variant-numeric: tabular-nums; line-height: 1; will-change: transform, opacity; }
    .colon { align-self: center; margin-top: 18px; color: #2d2d2d; font-size: 29px; font-weight: 700; text-align: center; }
    .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; padding: 4px 2px 2px; }
    button { min-width: 70px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: #71685b; font: inherit; font-size: 14px; cursor: pointer; }
    button.confirm { color: #2d2d2d; font-weight: 650; }
    @media (max-height: 540px) { .dialog { padding-top: 14px; padding-bottom: 8px; } .wheels { height: 215px; } .wheel { height: 164px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shade">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
      <h1 id="title">选择时间</h1>
      <div class="wheels">
        <div class="column"><div class="wheel" id="hours" aria-label="小时"></div></div>
        <div class="colon" aria-hidden="true">:</div>
        <div class="column"><div class="wheel" id="minutes" aria-label="分钟"></div></div>
      </div>
      <div class="buttons"><button id="cancel">取消</button><button class="confirm" id="confirm">确定</button></div>
    </section>
  </div>
  <script>
    const rowHeight = 46;
    const wheels = [];
    const format = value => String(value).padStart(2, '0');

    class Wheel {
      constructor(element, label, max, initial) {
        this.element = element;
        this.label = label;
        this.max = max;
        this.value = initial;
        this.offset = 0;
        this.startY = 0;
        this.lastY = 0;
        this.lastTime = 0;
        this.velocity = 0;
        this.dragging = false;
        this.frame = 0;
        this.render();
        element.addEventListener('pointerdown', event => this.down(event));
        element.addEventListener('pointermove', event => this.move(event));
        element.addEventListener('pointerup', event => this.up(event));
        element.addEventListener('pointercancel', () => this.snap());
        element.addEventListener('wheel', event => {
          event.preventDefault();
          this.step(event.deltaY > 0 ? 1 : -1);
          this.animateSnap();
        }, { passive: false });
        element.addEventListener('keydown', event => {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            this.step(event.key === 'ArrowDown' ? 1 : -1);
            this.render();
          }
        });
        element.tabIndex = 0;
        element.setAttribute('role', 'spinbutton');
      }
      wrap(value) { return (value + this.max + 1) % (this.max + 1); }
      step(amount) { this.value = this.wrap(this.value + amount); this.render(); }
      down(event) {
        event.preventDefault();
        cancelAnimationFrame(this.frame);
        this.element.setPointerCapture(event.pointerId);
        this.startY = this.lastY = event.clientY;
        this.lastTime = performance.now();
        this.velocity = 0;
        this.dragging = false;
      }
      move(event) {
        if (!this.element.hasPointerCapture(event.pointerId)) return;
        const now = performance.now();
        const y = event.clientY;
        const dy = y - this.lastY;
        if (!this.dragging && Math.abs(y - this.startY) > 5) this.dragging = true;
        if (this.dragging) {
          this.offset += dy;
          this.normalize();
          this.velocity = dy / Math.max(1, now - this.lastTime);
          this.render();
        }
        this.lastY = y;
        this.lastTime = now;
      }
      up(event) {
        if (!this.element.hasPointerCapture(event.pointerId)) return;
        this.element.releasePointerCapture(event.pointerId);
        if (!this.dragging) return;
        const impulse = Math.max(-4, Math.min(4, this.velocity * 120));
        if (Math.abs(this.velocity) > .45) this.offset += impulse * rowHeight;
        this.normalize();
        this.snap();
      }
      normalize() {
        while (this.offset <= -rowHeight) { this.offset += rowHeight; this.step(1); }
        while (this.offset >= rowHeight) { this.offset -= rowHeight; this.step(-1); }
      }
      snap() {
        if (this.offset <= -rowHeight / 2) { this.step(1); this.offset += rowHeight; }
        else if (this.offset >= rowHeight / 2) { this.step(-1); this.offset -= rowHeight; }
        this.animateSnap();
      }
      animateSnap() {
        cancelAnimationFrame(this.frame);
        const start = this.offset;
        const started = performance.now();
        const tick = now => {
          const t = Math.min(1, (now - started) / 160);
          const eased = 1 - Math.pow(1 - t, 3);
          this.offset = start * (1 - eased);
          this.render();
          if (t < 1) this.frame = requestAnimationFrame(tick);
          else { this.offset = 0; this.render(); }
        };
        this.frame = requestAnimationFrame(tick);
      }
      render() {
        this.element.replaceChildren();
        const highlight = document.createElement('div');
        highlight.className = 'highlight';
        this.element.append(highlight);
        for (let index = -2; index <= 2; index++) {
          const y = 95 + index * rowHeight + this.offset;
          const distance = Math.abs(y - 95) / rowHeight;
          const scale = Math.max(.68, 1 - distance * .15);
          const selected = distance < .5;
          const item = document.createElement('div');
          item.className = 'item';
          item.textContent = format(this.wrap(this.value + index));
          item.style.transform = `translateY(calc(-50% + ${y - 95}px)) scale(${scale})`;
          item.style.fontSize = `${(selected ? 26 : 23) * scale}px`;
          item.style.fontWeight = selected ? '700' : '400';
          item.style.opacity = selected ? '1' : String(Math.max(.3, .8 - distance * .2));
          item.style.color = selected ? '#2d2d2d' : '#8d867a';
          this.element.append(item);
        }
        this.element.setAttribute('aria-valuenow', String(this.value));
        this.element.setAttribute('aria-valuetext', `${this.label} ${format(this.value)}`);
      }
    }

    wheels.push(new Wheel(document.getElementById('hours'), '小时', 23, 7));
    wheels.push(new Wheel(document.getElementById('minutes'), '分钟', 59, 30));
    document.getElementById('cancel').addEventListener('click', () => {
      wheels[0].value = 7; wheels[1].value = 30;
      wheels.forEach(wheel => { wheel.offset = 0; wheel.render(); });
    });
  </script>
</body>
</html>
