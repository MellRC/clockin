plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.clockin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.clockin'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.0.17'
        testInstrumentationRunner 'com.example.clockin.FlowInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Package the current demo on every build so the APK cannot retain an older theme.
def syncDemoAssets = tasks.register('syncDemoAssets', Copy) {
    from(rootProject.file('demo.html'))
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure {
    dependsOn(syncDemoAssets)
}
