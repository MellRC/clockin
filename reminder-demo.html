<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffcb6f">
<title>工力全开 · 全屏提醒预览</title>
<style>
:root{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#49361f;background:#ffcb6f;font-synthesis:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffcb6f}
.screen{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#ffcb6f;touch-action:pan-y;user-select:none}
.status{position:absolute;inset:0 0 auto;height:calc(28px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 25px 0;display:flex;align-items:center;justify-content:space-between;color:#3f3529;font-size:14px;font-weight:650;letter-spacing:.1px}
.status-right{display:flex;align-items:center;gap:7px;font-size:12px}.signal{display:flex;align-items:flex-end;gap:2px;height:13px}.signal i{display:block;width:3px;border-radius:3px;background:#3f3529}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:13px}.wifi{width:13px;height:10px;border:2px solid #3f3529;border-color:#3f3529 transparent transparent;border-radius:50%;transform:rotate(0deg);position:relative;margin:0 2px}.wifi:after{content:"";position:absolute;left:4px;top:4px;width:3px;height:3px;border-radius:50%;background:#3f3529}.battery{width:22px;height:11px;border:1.5px solid #3f3529;border-radius:3px;padding:1px;position:relative}.battery:before{content:"";display:block;width:68%;height:100%;border-radius:1px;background:#3f3529}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:#3f3529}
.reminder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(45px + env(safe-area-inset-bottom));transition:transform .42s cubic-bezier(.2,.75,.25,1),opacity .32s ease}
.mascot{display:block;width:min(61vw,248px);height:min(61vw,248px);object-fit:contain;margin-bottom:23px;filter:drop-shadow(0 10px 18px #9f691b18)}
h1{margin:0;color:#fff8e8;font-size:clamp(23px,6.4vw,29px);font-weight:720;letter-spacing:.5px;text-align:center;text-shadow:0 2px 9px #a66b1f26}
.title-wrap{position:relative;display:grid;place-items:center;min-width:min(84vw,350px);min-height:76px;isolation:isolate}
.title-wrap h1{position:relative;z-index:1;transform:rotate(var(--tilt,0deg));transform-origin:50% 50%}
.sound-wave{position:absolute;left:50%;top:50%;width:20px;height:20px;border:2px solid #fff8e8;border-radius:50%;opacity:var(--wave-opacity,0);transform:translate(-50%,-50%) scale(var(--wave-scale,.7));pointer-events:none}
.home-indicator{position:absolute;z-index:2;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));width:42px;height:4px;border-radius:5px;background:#fff8e8;transform:translateX(-50%);opacity:.92}
.wecom{position:absolute;inset:0;background:#f5f6f7;display:none;opacity:0;transition:opacity .32s ease;color:#24272a}.wecom.show{display:block}.wecom.visible{opacity:1}
.wecom-head{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e8e9eb;font-size:17px;font-weight:700}.wecom-head small{font-size:12px;font-weight:500;color:#8a8f95}.wecom-search{margin:14px 15px 10px;padding:11px;border-radius:10px;background:#e9ebed;color:#92979c;text-align:center;font-size:13px}
.chat{display:flex;align-items:center;gap:12px;padding:14px 17px;background:#fff;border-bottom:1px solid #f0f1f2}.avatar{width:45px;height:45px;border-radius:14px;background:#ffcb6f;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chat-copy{flex:1}.chat-copy strong{display:block;font-size:15px;font-weight:650}.chat-copy span{display:block;margin-top:5px;color:#8c9197;font-size:12px}.chat time{align-self:flex-start;color:#a4a8ac;font-size:10px}.wecom-tab{position:absolute;left:0;right:0;bottom:0;padding:11px 0 calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#fff;border-top:1px solid #eee;color:#848a90;font-size:10px}.wecom-tab b{color:#b77a12}
.reset{position:absolute;z-index:4;top:calc(45px + env(safe-area-inset-top));right:14px;display:none;padding:9px 13px;border:1px solid #ffffff88;border-radius:20px;background:#fff4d9;color:#83560c;font-size:12px;font-weight:700}.reset.show{display:block}
@media(min-width:560px){body{display:grid;place-items:center;background:#f5f0e7}.screen{width:390px;height:min(844px,calc(100dvh - 32px));border:1px solid #e9dfd0;border-radius:34px;box-shadow:0 24px 90px #4b38201c}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="status"><span>09:41</span><span class="status-right"><span class="signal"><i></i><i></i><i></i><i></i></span><i class="wifi"></i><span>5G</span><i class="battery"></i></span></div>
  <section class="reminder" id="reminder" aria-label="锁屏打卡提醒">
    <div class="title-wrap" aria-label="打卡时间到啦"><i class="sound-wave"></i><i class="sound-wave"></i><i class="sound-wave"></i><i class="sound-wave"></i><i class="sound-wave"></i><i class="sound-wave"></i><h1>打卡时间到啦！</h1></div>
  </section>
  <section class="wecom" id="wecom" aria-label="企业微信预览">
    <header class="wecom-head"><span>‹　微信</span><span>企业微信</span><small>···</small></header>
    <div class="wecom-search">⌕　搜索</div>
    <div class="chat"><div class="avatar"><img src="app/src/main/res/drawable-nodpi/ic_launcher_foreground.png" alt=""></div><div class="chat-copy"><strong>工力全开</strong><span>已为你打开企业微信</span></div><time>刚刚</time></div>
    <div class="wecom-tab"><b>微信</b><span>通讯录</span><span>工作台</span><span>我</span></div>
  </section>
  <button class="reset" id="reset" type="button">重新预览提醒</button>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<script>
const reminder=document.getElementById('reminder'),wecom=document.getElementById('wecom'),reset=document.getElementById('reset'),title=document.querySelector('.title-wrap h1'),waves=[...document.querySelectorAll('.sound-wave')];let startX=0,startY=0,pulseStart=performance.now();
function pulseFrame(now){if(reminder.style.display==='none')return;const phase=(now-pulseStart)%3100,active=phase<700?phase:phase>=1050&&phase<1750?phase-1050:-1;title.style.setProperty('--tilt',active<0?'0deg':`${Math.sin(active*.045)*6}deg`);waves.forEach((wave,i)=>{const burst=i<3?0:1050,stagger=(i%3)*230,age=phase-burst-stagger;if(age<0||age>=950){wave.style.setProperty('--wave-opacity','0');return}const progress=age/950,eased=1-Math.pow(1-progress,3);wave.style.setProperty('--wave-opacity',String(.62*Math.pow(1-progress,1.3)));wave.style.setProperty('--wave-scale',String(.7+19.8*eased))});requestAnimationFrame(pulseFrame)}requestAnimationFrame(pulseFrame);
function start(e){const p=e.touches?e.touches[0]:e;startX=p.clientX;startY=p.clientY}
function end(e){const p=e.changedTouches?e.changedTouches[0]:e,dx=p.clientX-startX,dy=p.clientY-startY;if(dy<-60&&Math.abs(dy)>Math.abs(dx)*1.15)dismiss()}
function dismiss(){if(reminder.style.transform)return;reminder.style.transform='translateY(-110%)';reminder.style.opacity='0';setTimeout(()=>{reminder.style.display='none';wecom.classList.add('show');requestAnimationFrame(()=>wecom.classList.add('visible'));reset.classList.add('show')},400)}
function replay(){wecom.classList.remove('visible');reset.classList.remove('show');setTimeout(()=>{wecom.classList.remove('show');reminder.style.display='flex';reminder.style.transform='';reminder.style.opacity='';pulseStart=performance.now();requestAnimationFrame(pulseFrame)},330)}
reminder.addEventListener('touchstart',start,{passive:true});reminder.addEventListener('touchend',end,{passive:true});reminder.addEventListener('pointerdown',start);reminder.addEventListener('pointerup',end);reset.addEventListener('click',replay);
</script>
</body>
</html>
