<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFCB6F">
<title>原生锁屏提醒视觉参考</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#FFCB6F;color:#4C3822}
.page{min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 26px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px}.brand{font-weight:700}.clock{font-variant-numeric:tabular-nums}
.hero{flex:1;min-height:190px;display:grid;place-items:center;position:relative;width:100%;max-width:360px}.rings,.rings:before,.rings:after{position:absolute;width:46px;height:46px;border:2px solid #fff8e8;border-radius:50%;animation:expand 2.2s ease-out infinite}.rings:before,.rings:after{content:"";inset:-2px}.rings:before{animation-delay:.7s}.rings:after{animation-delay:1.4s}@keyframes expand{0%{transform:scale(.4);opacity:.8}100%{transform:scale(4.8);opacity:0}}
h1{position:relative;color:#fff8e8;font-size:clamp(28px,8vw,36px);animation:rock 1.3s ease-in-out infinite alternate}@keyframes rock{to{transform:rotate(1.5deg)}}
.task{line-height:1.8;margin:8px 0 30px}.task p{margin:3px}.primary,.secondary{width:100%;max-width:420px;min-height:54px;border:0;border-radius:14px;font:inherit;font-size:18px}.primary{background:#fff7e8;color:#4c3822;font-weight:700}.secondary{margin-top:8px;background:transparent;color:#4c3822;font-size:15px}.hint{max-width:420px;font-size:13px;line-height:1.65;margin:12px 0 0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body><main class="page">
  <header class="top"><span class="brand">工力全开</span><time id="clock" class="clock"></time></header>
  <section class="hero" aria-label="提醒动画"><i class="rings" aria-hidden="true"></i><h1>打卡时间到啦！</h1></section>
  <section class="task" aria-label="当前任务信息"><p>打卡类型、所属工作日和有效区间由当前任务提供</p></section>
  <button class="primary" type="button">解锁继续</button>
  <button class="secondary" type="button">停止本次提醒</button>
  <p class="hint">向右滑动或使用无障碍操作收起提醒。右滑收起并停止震动；有效期内解锁后仍会检查打卡条件。</p>
</main><script>
const clock=document.getElementById('clock');clock.textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',month:'numeric',day:'numeric',weekday:'long'}).format(new Date());
</script></body></html>
